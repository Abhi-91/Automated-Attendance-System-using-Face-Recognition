<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition Attendance</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #00d4ff; margin-bottom: 5px; }
        p { color: #aaa; margin-bottom: 20px; }
        .video-container {
            display: inline-block;
            border: 3px solid #00d4ff;
            border-radius: 10px;
            overflow: hidden;
        }
        img { display: block; width: 640px; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #00d4ff;
            color: #1a1a2e;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
        }
        .btn:hover { background: #00b8d9; }
    </style>
</head>
<body>
    <h1>📷 Face Recognition Attendance System</h1>
    <p>Look at the camera — attendance will be marked automatically</p>
    <div class="video-container">
        <img src="{{ url_for('video_feed') }}" alt="Camera Feed">
    </div>
    <br>
    <a href="/attendance" class="btn">📋 View Attendance Records</a>
</body>
</html>
