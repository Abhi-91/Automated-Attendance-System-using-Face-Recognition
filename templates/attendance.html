<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Records</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 30px;
        }
        h1 { color: #00d4ff; text-align: center; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th {
            background: #00d4ff;
            color: #1a1a2e;
            padding: 12px;
            text-align: left;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #333;
        }
        tr:hover { background: #16213e; }
        .empty {
            text-align: center;
            color: #aaa;
            margin-top: 50px;
            font-size: 18px;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background: #00d4ff;
            color: #1a1a2e;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>📋 Attendance Records</h1>
    <a href="/" class="btn">← Back to Camera</a>

    {% if records %}
    <table>
        <tr>
            <th>Name</th>
            <th>Date</th>
            <th>Time</th>
        </tr>
        {% for record in records %}
        <tr>
            <td>{{ record.Name }}</td>
            <td>{{ record.Date }}</td>
            <td>{{ record.Time }}</td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <p class="empty">No attendance records yet. Go back and look at the camera!</p>
    {% endif %}
</body>
</html>
